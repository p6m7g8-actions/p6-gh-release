name: "P6 GHA: Strawman GH release"
description: "P6 GHA: Strawman GH release"
author: "Philip M. Gollucci"

inputs:
  gh_token:
    description: "GitHub token for authentication"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: p6m7g8-actions/checkout@main
      with:
        fetch-depth: 0

    - name: Bump Version
      id: bump
      shell: bash
      run: |
        set -x
        latest_tag=$(git tag --list "v*" --sort=-v:refname | head -1)
        if [ -z "$latest_tag" ]; then
          major=0
          minor=0
          patch=0
          log_lines=$(git log --pretty="format:- %s")
          full_log=$(git log --pretty="format:%B")
        else
          log_lines=$(git log "$latest_tag"..HEAD --pretty="format:- %s")
          full_log=$(git log "$latest_tag"..HEAD --pretty="format:%B")
          major=$(echo "$latest_tag" | cut -d. -f1 | sed -e 's,^v,,')
          minor=$(echo "$latest_tag" | cut -d. -f2)
          patch=$(echo "$latest_tag" | cut -d. -f3)
        fi

        # Bump detection is anchored to conventional-commit prefixes. Bare
        # substring matches used to fire on any message merely CONTAINING the
        # word: "docs: major README rework" bumped major, and "refactor:
        # simplify prefix handling" bumped patch off the "fix" inside "prefix".
        # A `!` marker and a BREAKING CHANGE footer are now both major; the
        # footer needs %B because %s only carries the subject line.
        bump_kind="none"
        if printf '%s\n' "$full_log" | grep -qE '^BREAKING[ -]CHANGE:' \
           || printf '%s\n' "$log_lines" | grep -qE '^- [a-z]+(\([^)]*\))?!:' \
           || printf '%s\n' "$log_lines" | grep -qE '^- major(\([^)]*\))?:'; then
          bump_kind="major"
        elif printf '%s\n' "$log_lines" | grep -qE '^- feat(\([^)]*\))?:'; then
          bump_kind="minor"
        elif printf '%s\n' "$log_lines" | grep -qE '^- fix(\([^)]*\))?:'; then
          bump_kind="patch"
        elif printf '%s\n' "$log_lines" | grep -v 'chore(release):' | grep -qE '^- chore(\([^)]*\))?:'; then
          bump_kind="patch"
        fi

        case "$bump_kind" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac

        new_tag="v$major.$minor.$patch"
        mkdir -p dist/
        if [ -f action.yml ]; then
          cp action.yml dist/
        fi
        printf '%s\n' "$new_tag" > dist/releasetag.txt
        printf '%s\n' "$log_lines" | grep -v 'chore(release):' > dist/changelog.md
        printf 'Semantic version tag: %s -> %s\n' "${latest_tag:-none}" "$new_tag"
        printf 'ChangeLog:\n'
        cat dist/changelog.md

        # Reuse the decision above rather than re-deriving it with a second,
        # differently-worded grep. This output was previously computed and then
        # never consumed, because the release step had no `if:`.
        if [ "$bump_kind" = "none" ]; then
          echo "bump=false" >> "$GITHUB_OUTPUT"
        else
          echo "bump=true" >> "$GITHUB_OUTPUT"
        fi
        set +x

    - name: Github Release
      if: steps.bump.outputs.bump == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.gh_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        set -x
        tag_name=$(cat dist/releasetag.txt)
        if gh release view "$tag_name" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release with tag $tag_name already exists. Skipping release creation."
        else
          gh release create "$tag_name" -R "$GITHUB_REPOSITORY" -F dist/changelog.md -t "$tag_name" --target "$GITHUB_REF"
          echo "Release with tag $tag_name created successfully."
        fi
